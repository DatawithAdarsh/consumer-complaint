name: Keep Supabase awake
# Supabase free projects pause after about a week of no activity.
# This pings the API twice a week so your site doesn't go down.
on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST API
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
